name: ros2 ci
on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: read
  issues: write         # hiding bot comments
  pull-requests: write  # hiding bot comments

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - alpine-version: "3.23"
            ros-distro: jazzy
    uses: alpine-ros/alpine-ros-ci-workflows/.github/workflows/ros2.yaml@main
    with:
      alpine-version: ${{ matrix.alpine-version }}
      ros-distro: ${{ matrix.ros-distro }}
      enable-bot-comment: true
      bot-comment-api-base: "https://ghbot-api.at-wat.tokyo"
      # sq_ros1_rclcpp_compat is a ROS 1-only dependency (see .rosinstall);
      # do not check it out for the ROS 2 build.
      no-rosinstall-files: true
    secrets:
      bot-comment-token: "d50e89aa-016e-450b-a140-931fa5daa484"
