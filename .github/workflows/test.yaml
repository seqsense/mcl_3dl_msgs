name: ci
on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: read
  issues: write         # hiding bot comments
  pull-requests: write  # hiding bot comments

jobs:
  test:
    uses: alpine-ros/alpine-ros-ci-workflows/.github/workflows/ros1.yaml@main
    with:
      enable-bot-comment: true
      bot-comment-api-base: "https://ghbot-api.at-wat.tokyo"
      enable-codecov: true
      # .rosinstall pulls the whole sq_ros1_rclcpp_compat repository, whose
      # samples/ packages are demos that this repository must not be gated on.
      # Restrict the build to this package plus the compat package itself.
      # The second path resolves to the container's ~/extsrc, where the
      # rosinstall dependencies are checked out.
      manifest-files: |
        package.xml
        ../../home/builder/extsrc/sq_ros1_rclcpp_compat/sq_ros1_rclcpp_compat/package.xml
    secrets:
      bot-comment-token: "d50e89aa-016e-450b-a140-931fa5daa484"
      codecov-upload-token: ${{ secrets.CODECOV_TOKEN }}
